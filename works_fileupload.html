<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>파일 전송: 드래그 앤 드롭</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --text:#202020;              /* text/default */
  --sub:#717171;               /* text/subtext */
  --border:#EDEDED;            /* border/gray_subtle */
  --bg-gray-blue:#F5F6F6;      /* BG/gray_blue */
  --primary:#6267E9;           /* BG_btn/primary_default */
  --primary-hover:#8185ED;
  --accent:#6267E9;            /* border/primary_accent (드롭 위치 표시선) */
  --floating:0 0 12px rgba(108,115,122,.12);
  --font:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:rgba(0,0,0,.5);-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
svg{display:block}

.popup{position:relative;width:min(600px,94vw);height:min(600px,92vh);background:#fff;border-radius:32px;
  box-shadow:var(--floating);display:flex;flex-direction:column;overflow:hidden}
.p-title{flex:none;height:60px;padding:16px 20px;display:flex;align-items:center;border-bottom:1px solid var(--border)}
.p-title h2{flex:1;font-size:20px;line-height:28px;font-weight:700}
.p-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.p-bodywrap{position:relative;flex:1;min-height:0}
.p-body{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.p-body::-webkit-scrollbar{display:none}
.grad{position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff);
  pointer-events:none;opacity:0;transition:opacity .15s}
.grad.on{opacity:1}
.p-btn{flex:none;height:76px;padding:12px 16px;border-top:1px solid var(--border);background:#fff}
.btn{width:100%;height:52px;border-radius:16px;background:var(--primary);color:#fff;font-size:16px;font-weight:700}
.btn:hover{background:var(--primary-hover)}

/* ---------- 리스트 ---------- */
.list{list-style:none;padding:0;position:relative}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid transparent;
  background:transparent;border-radius:0;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.row *{-webkit-user-drag:none}
/* 하단 보더: 라운드가 걸리지 않는 직선 */
.row::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--border);pointer-events:none}
/* 호버: 리스트 컬러가 BG/gray_blue 로 교체 (opacity 변화 없음) */
.row:hover,
.row.dragging{background:var(--bg-gray-blue)}
/* 드래그 중에는 다른 행이 호버로 바뀌지 않도록 */
body.is-dragging .row:not(.dragging):hover{background:transparent}
/* 드래그 중인 행: 호버 상태(gray_blue) 그대로 유지, 오퍼시티 없음 */
.row.dragging{position:fixed;z-index:30;opacity:1;cursor:grabbing;border:1px solid var(--border);border-radius:16px;padding:11px 7px 12px;
  box-shadow:0 0 8px rgba(108,115,122,.12);pointer-events:none}
.row.dragging::after{display:none}
.row.dragging.back{transition:top .2s ease,left .2s ease}
.ph{list-style:none;border-bottom:1px solid transparent}
.thumb{flex:none;width:48px;height:48px;border-radius:12px;background:var(--bg-gray-blue);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.txt{flex:1;min-width:0}
.nm{font-size:16px;line-height:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:14px;line-height:20px;color:var(--sub);margin-top:4px}
.more{flex:none;width:24px;height:24px;display:flex;align-items:center;justify-content:center}

.indicator{position:fixed;height:2px;border-radius:1px;background:var(--accent);z-index:20; /* 드래그 중인 행(z-index:30)보다 아래 레이어 */display:none;pointer-events:none}
body.is-dragging,body.is-dragging *{cursor:grabbing !important}
</style>
</head>

  <div class="p-bodywrap">

</div>

  $('list').innerHTML = items.map(it => `
    <li class="row" data-id="${it.id}">
      <div class="thumb ${it.img !== undefined ? '' : 'file'}">${it.img !== undefined ? `<img src="${THUMBS[it.img]}" alt="" draggable="false">` : IC_PDF}</div>
      <div class="txt"><div class="nm">${esc(it.name)}</div><div class="meta">${fmt(it.size)}</div></div>
      <div class="more">${IC_MORE}</div>
    </li>`).join('');
  $('body').scrollTop = top;
  updateGrad();
}
function updateGrad(){
  const b = $('body');
  $('grad').classList.toggle('on', b.scrollHeight > b.clientHeight + 2 && b.scrollTop + b.clientHeight < b.scrollHeight - 4);
}
$('body').addEventListener('scroll', updateGrad);
// 브라우저 기본 드래그(반투명 고스트)를 쓰지 않도록 차단
document.addEventListener('dragstart', e => e.preventDefault());

/* ---------- 클릭 → 드래그 → 드롭 (호버 상태 유지) ---------- */
let drag = null;

$('list').addEventListener('pointerdown', e => {
  const row = e.target.closest('.row');
  if (!row || e.button > 0) return;
  drag = { row, id: +row.dataset.id, startY: e.clientY, started: false };
});

window.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.started){
    if (Math.abs(e.clientY - drag.startY) < 5) return;
    const r = drag.row.getBoundingClientRect();
    drag.h = r.height; drag.offY = e.clientY - r.top; drag.started = true;
    drag.ph = document.createElement('li'); drag.ph.className = 'ph'; drag.ph.style.height = r.height + 'px';
    drag.row.after(drag.ph);
    drag.row.classList.add('dragging');            // gray_blue 유지, opacity 없음
    drag.row.style.cssText = `left:${r.left + 12}px;top:${r.top}px;width:${r.width - 24}px;`;   // 좌우 12px 안쪽의 라운드 카드로 전환
    document.body.classList.add('is-dragging');
  }
  const top = e.clientY - drag.offY;
  drag.row.style.top = top + 'px';

  const br = $('body').getBoundingClientRect();
  if (e.clientY < br.top + 40) $('body').scrollTop -= 8;
  else if (e.clientY > br.bottom - 40) $('body').scrollTop += 8;

  // 들고 있는 리스트의 중심 기준으로 "어느 리스트 사이에 들어갈지" 계산
  const rows = [...document.querySelectorAll('.row:not(.dragging)')];
  const center = top + drag.h / 2;
  let t = 0;
  rows.forEach(r => { const rr = r.getBoundingClientRect(); if (rr.top + rr.height/2 < center) t++; });
  drag.target = t;
  drag.inside = e.clientX >= br.left && e.clientX <= br.right && e.clientY >= br.top && e.clientY <= br.bottom;

  // 표시선: 들어갈 위치(리스트 사이)에 표시. 레이어는 들고 있는 리스트보다 아래.
  // 들고 있는 리스트(폭 576)에 가려지지 않도록 선은 팝업 폭 전체로 그어 양옆으로 보이게 함
  const ind = $('indicator');
  if (drag.inside && rows.length){
    const ref = t < rows.length ? rows[t].getBoundingClientRect().top : rows[rows.length-1].getBoundingClientRect().bottom;
    ind.style.cssText = `display:block;left:${br.left}px;width:${br.width}px;top:${ref - 1}px`;
  } else ind.style.display = 'none';
});

window.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  $('indicator').style.display = 'none';
  document.body.classList.remove('is-dragging');
  if (!d.started) return;
  if (d.inside){
    const moving = items.find(i => i.id === d.id);
    const rest = items.filter(i => i.id !== d.id);
    rest.splice(d.target, 0, moving);
    items = rest;
    render();
  } else {
    // 드롭 가능 위치를 벗어나면 기존 위치로 복귀
    d.row.classList.add('back');
    d.row.style.top = d.ph.getBoundingClientRect().top + 'px';
    setTimeout(render, 210);
  }
});
window.addEventListener('pointercancel', () => { if (drag?.started) { drag = null; document.body.classList.remove('is-dragging'); $('indicator').style.display='none'; render(); } else drag = null; });

render();
</script>
</body>
